name: Export ASC issuer (temp)
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Print issuer (char split; same-account secret reuse)
        env:
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import os
          s = os.environ.get("ISSUER","")
          print("LEN", len(s))
          # print as hex so GHA secret masking cannot match the raw UUID
          print("HEX", s.encode().hex())
          PY
